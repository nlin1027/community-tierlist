version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    assignees:
      - nlin1027

  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    assignees:
      - nlin1027

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - nlin1027

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
    assignees:
      - nlin1027